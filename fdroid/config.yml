# fdroidserver config for the self-hosted repo published to GitHub Pages by
# the fdroid job in .github/workflows/android_gh_release.yml. Secrets come from
# the environment; the keystore itself is restored from FDROID_KEYSTORE_BASE64.

repo_url: https://serabin1.github.io/tydl/repo
repo_name: Tydl
repo_description: >-
  Releases of Tydl, the Android app from github.com/Serabin1/tydl. APKs are
  signed with the same key as the GitHub release downloads.

repo_keyalias: { env: FDROID_KEY_ALIAS }
keystore: keystore.p12
keystorepass: { env: FDROID_KEYSTORE_PASSWORD }
keypass: { env: FDROID_KEYSTORE_PASSWORD }
keydname: CN=Tydl F-Droid repo, O=SerAbin1

# Only the APKs the job downloads; older ones aren't kept anywhere.
archive_older: 0
